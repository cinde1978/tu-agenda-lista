<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="512" height="256" rx="128" fill="url(#gloss)" />

  <!-- Calendar Container with Shadow -->
  <g filter="url(#shadow)">
    <!-- Calendar Body -->
    <rect x="76" y="116" width="360" height="300" rx="36" fill="#FFFFFF" />
    <rect x="76" y="116" width="360" height="96" rx="36" fill="#1D4ED8" />
    <rect x="76" y="176" width="360" height="36" fill="#1D4ED8" />

    <!-- Spiral Binder Rings -->
    <rect x="136" y="76" width="24" height="72" rx="12" fill="#FFFFFF" />
    <rect x="244" y="76" width="24" height="72" rx="12" fill="#FFFFFF" />
    <rect x="352" y="76" width="24" height="72" rx="12" fill="#FFFFFF" />

    <!-- Schedule Grid Dots -->
    <circle cx="148" cy="260" r="18" fill="#DBEAFE" />
    <circle cx="256" cy="260" r="18" fill="#DBEAFE" />
    <circle cx="364" cy="260" r="18" fill="#DBEAFE" />

    <circle cx="148" cy="336" r="18" fill="#DBEAFE" />
    <circle cx="256" cy="336" r="18" fill="#DBEAFE" />
    <circle cx="364" cy="336" r="18" fill="#DBEAFE" />

    <!-- Dynamic Checkmark in Blue -->
    <path d="M196 332 L240 376 L348 244" fill="none" stroke="#2563EB" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkle Accent Star -->
  <path d="M390 146 L396 162 L412 166 L400 178 L403 194 L390 185 L377 194 L380 178 L368 166 L384 162 Z" fill="#FDE047" />
</svg>
